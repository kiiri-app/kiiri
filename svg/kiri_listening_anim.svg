<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1439" overflow="visible">
  <!-- Kiri listening: the original idle art (kiri_noeye.png) bobbing gently
       toward the sound, with floating music notes + sound ripples in kiri's
       bow-blue. Prefix: kl-  (PNG-wrap: animate the real art, never redraw it.) -->
  <style>
    #kl-body {
      transform-box: fill-box;
      transform-origin: 50% 96%;
      animation: kl-bob 4.6s ease-in-out infinite;
    }
    @keyframes kl-bob {                          /* lean/tilt left-right, tracking a sound */
      0%, 10%   { transform: rotate(-2.2deg) translateY(0px); }
      40%, 60%  { transform: rotate(2.4deg) translateY(-8px); }
      90%, 100% { transform: rotate(-2.2deg) translateY(0px); }
    }
    #kl-breathe {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: kl-breathe 3.2s ease-in-out infinite;
    }
    @keyframes kl-breathe {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.006, 1.018); }
    }
    .kl-note { opacity: 0; animation: kl-note 4.6s ease-in-out infinite; }
    .kl-note2 { animation-delay: -1.5s; }
    .kl-note3 { animation-delay: -3.1s; }
    @keyframes kl-note {
      0%       { opacity: 0; transform: translate(0px, 46px) rotate(-6deg); }
      18%      { opacity: 0.9; }
      55%      { opacity: 0.5; }
      80%, 100%{ opacity: 0; transform: translate(18px, -190px) rotate(8deg); }
    }
    .kl-arc {
      opacity: 0;
      animation: kl-arc 2.7s ease-out infinite;
      fill: none;
      stroke: #3f63a8;
      stroke-linecap: round;
    }
    .kl-arc2 { animation-delay: -0.9s; }
    .kl-arc3 { animation-delay: -1.8s; }
    @keyframes kl-arc {
      0%       { opacity: 0; transform: scale(0.84); }
      25%      { opacity: 0.7; }
      70%, 100%{ opacity: 0; transform: scale(1.1); }
    }
    #kl-arcs { transform-box: fill-box; transform-origin: 0% 100%; }
  </style>

  <g id="kl-body">
    <g id="kl-breathe">
      <image href="../svg/kiri_noeye.png" width="1065" height="1439"/>
    </g>
    <!-- sound ripples off the right ear -->
    <g id="kl-arcs">
      <path class="kl-arc"         d="M840 150 C880 205 902 270 900 340" stroke-width="13"/>
      <path class="kl-arc kl-arc2" d="M900 110 C952 175 978 250 972 350" stroke-width="13"/>
      <path class="kl-arc kl-arc3" d="M960 70 C1024 150 1050 245 1042 360" stroke-width="13"/>
    </g>
  </g>

  <!-- floating music notes, left of the head -->
  <g fill="#3f63a8">
    <g class="kl-note" transform="translate(140, 250)">
      <ellipse cx="0" cy="56" rx="24" ry="17" transform="rotate(-18 0 56)"/>
      <path d="M20 51 L20 -40 L74 -53 L74 -21 L32 -12 L32 51 Z"/>
    </g>
    <g class="kl-note kl-note2" transform="translate(72, 450)">
      <ellipse cx="0" cy="44" rx="20" ry="15" transform="rotate(-18 0 44)"/>
      <rect x="15" y="-47" width="10" height="93" rx="5"/>
      <path d="M15 -47 C45 -38 58 -20 53 5 C47 -8 33 -17 15 -20 Z"/>
    </g>
    <g class="kl-note kl-note3" transform="translate(205, 500)">
      <ellipse cx="0" cy="37" rx="18" ry="13" transform="rotate(-18 0 37)"/>
      <rect x="12" y="-40" width="10" height="80" rx="5"/>
    </g>
  </g>
</svg>
