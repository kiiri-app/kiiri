<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1439" overflow="visible">
  <!-- Kiri pointing pose: sitting, right arm stretched out to the RIGHT with one
       toe out, eyes and head toward the target. The renderer mirrors the whole
       SVG (scaleX) when the target is on the left. Prefix: kp- -->
  <style>
    #kp-arm {
      transform-box: fill-box;
      transform-origin: 8% 42%;                  /* shoulder */
      animation: kp-bob 2.6s ease-in-out infinite;
    }
    @keyframes kp-bob {                          /* insistent "there! there!" bob */
      0%, 100% { transform: rotate(0deg); }
      18%      { transform: rotate(-5deg); }
      32%      { transform: rotate(1.5deg); }
      46%      { transform: rotate(-3deg); }
      60%      { transform: rotate(0deg); }
    }
    #kp-head {
      transform-box: fill-box;
      transform-origin: 50% 90%;
      animation: kp-head 5.4s ease-in-out infinite;
    }
    @keyframes kp-head {                         /* mostly on target, quick check back at you */
      0%, 58%   { transform: rotate(6deg); }
      68%, 80%  { transform: rotate(-2deg); }
      90%, 100% { transform: rotate(6deg); }
    }
    #kp-pupils { animation: kp-look 5.4s ease-in-out infinite; }
    @keyframes kp-look {
      0%, 58%   { transform: translate(22px, -4px); }
      68%, 80%  { transform: translate(-6px, 2px); }
      90%, 100% { transform: translate(22px, -4px); }
    }
    .kp-lid {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transform: scaleY(0);
      animation: kp-blink 4.4s linear infinite;
    }
    @keyframes kp-blink {
      0%, 89%, 94.5%, 100% { transform: scaleY(0); }
      91%, 92.5%           { transform: scaleY(1); }
    }
    .kp-ear-l, .kp-ear-r { transform-box: fill-box; transform-origin: 50% 96%; }
    .kp-ear-r { animation: kp-twitch 5.8s linear infinite; }
    @keyframes kp-twitch {
      0%, 80%, 90%, 100% { transform: rotate(0deg); }
      84%                { transform: rotate(7deg); }
      87%                { transform: rotate(-2deg); }
    }
    #kp-tail {
      transform-box: fill-box;
      transform-origin: 90% 88%;
      animation: kp-tail 4.2s ease-in-out infinite;
    }
    @keyframes kp-tail {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(7deg); }
    }
    .kp-spark {
      opacity: 0;
      animation: kp-spark 2.6s ease-out infinite;
      fill: none;
      stroke: #c96f4a;
      stroke-linecap: round;
    }
    .kp-spark2 { animation-delay: -0.5s; }
    @keyframes kp-spark {                        /* emphasis flicks off the paw tip */
      0%, 12%  { opacity: 0; transform: scale(0.8); }
      22%      { opacity: 0.9; }
      48%, 100%{ opacity: 0; transform: scale(1.15); }
    }
    #kp-sparks { transform-box: fill-box; transform-origin: 0% 50%; }
  </style>

  <!-- tail curls out on the LEFT for balance (arm points right) -->
  <path id="kp-tail" d="M390 1354 C260 1330 158 1240 126 1104 C98 984 124 862 204 782 C236 750 280 760 284 796 C288 826 260 844 232 884 C180 958 164 1050 192 1130 C226 1226 304 1294 406 1316 Z" fill="#101216"/>

  <!-- ============ BODY (sitting) ============ -->
  <path d="M513 620 C384 620 302 726 292 880 C282 1030 316 1220 366 1330 C398 1400 452 1428 513 1428 C574 1428 630 1400 662 1330 C712 1220 746 1030 736 880 C726 726 642 620 513 620 Z" fill="#101216"/>
  <!-- front paw (only the left one on the ground; right arm is up pointing) -->
  <path d="M420 1300 C394 1300 376 1326 378 1360 C380 1396 400 1420 428 1420 C456 1420 474 1398 476 1364 C478 1328 448 1300 420 1300 Z" fill="#101216"/>
  <g stroke="#2a2d36" stroke-width="6" stroke-linecap="round">
    <path d="M414 1418 L414 1394"/>
    <path d="M438 1418 L438 1394"/>
  </g>

  <!-- ============ HEAD (turned toward the target) ============ -->
  <g id="kp-head">
    <g class="kp-ear-l">
      <path d="M290 300 C244 180 220 84 232 24 C304 52 380 128 434 232 C384 256 332 280 290 300 Z" fill="#101216"/>
      <path d="M306 262 C278 192 264 134 268 98 C308 120 350 166 382 224 C354 238 328 250 306 262 Z" fill="#fdfdfd"/>
    </g>
    <g class="kp-ear-r">
      <path d="M746 300 C792 180 816 84 804 24 C732 52 656 128 602 232 C652 256 704 280 746 300 Z" fill="#101216"/>
      <path d="M730 262 C758 192 772 134 768 98 C728 120 686 166 654 224 C682 238 708 250 730 262 Z" fill="#fdfdfd"/>
    </g>
    <path d="M518 190 C360 190 234 292 234 452 C234 598 358 692 518 692 C678 692 802 598 802 452 C802 292 676 190 518 190 Z" fill="#101216"/>
    <g stroke="#101216" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M240 460 C160 456 94 464 42 482"/>
      <path d="M244 502 C168 510 108 528 60 552"/>
      <path d="M796 460 C876 456 942 464 994 482"/>
      <path d="M792 502 C868 510 928 528 976 552"/>
    </g>
    <g>
      <ellipse cx="430" cy="452" rx="84" ry="92" fill="#ffffff"/>
      <ellipse cx="608" cy="452" rx="84" ry="92" fill="#ffffff"/>
      <g id="kp-pupils" fill="#101216">
        <circle cx="430" cy="452" r="26"/>
        <circle cx="608" cy="452" r="26"/>
      </g>
      <rect class="kp-lid" x="344" y="358" width="172" height="188" rx="84" fill="#101216"/>
      <rect class="kp-lid" x="522" y="358" width="172" height="188" rx="84" fill="#101216"/>
    </g>
    <path d="M502 518 C508 510 528 510 534 518 C530 530 522 538 518 538 C514 538 506 530 502 518 Z" fill="#e59aa6"/>
    <!-- open, eager little mouth -->
    <path d="M498 566 C510 580 528 580 540 566" stroke="#2a2d36" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- blue bow -->
  <g>
    <path d="M488 716 C434 684 372 666 326 670 C308 712 308 758 326 800 C374 802 436 784 488 748 Z" fill="#274794" stroke="#16204a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M542 716 C596 684 658 666 704 670 C722 712 722 758 704 800 C656 802 594 784 542 748 Z" fill="#274794" stroke="#16204a" stroke-width="10" stroke-linejoin="round"/>
    <rect x="479" y="694" width="72" height="72" rx="20" fill="#274794" stroke="#16204a" stroke-width="10"/>
  </g>

  <!-- ============ POINTING ARM (extends right, slightly up) ============ -->
  <g id="kp-arm">
   <g transform="rotate(-9 590 830)">
    <path d="M600 800 C700 768 810 744 906 736 C946 732 972 748 972 776 C972 802 948 816 910 820 C822 830 722 850 632 876 C596 886 570 868 570 838 C570 818 582 806 600 800 Z" fill="#101216"/>
    <!-- paw with one toe out (the pointing finger) -->
    <path d="M920 728 C958 720 992 734 1002 762 C1012 790 996 816 962 826 C930 834 900 822 890 796 C880 768 894 736 920 728 Z" fill="#101216"/>
    <path d="M998 742 C1022 734 1044 740 1050 756 C1056 772 1044 786 1022 790 C1002 794 986 786 982 770 C978 756 984 746 998 742 Z" fill="#101216"/>
    <g stroke="#2a2d36" stroke-width="6" stroke-linecap="round">
      <path d="M932 820 L938 800"/>
      <path d="M958 814 L962 796"/>
    </g>
    <!-- emphasis flicks near the toe tip -->
    <g id="kp-sparks">
      <path class="kp-spark"          d="M1058 716 L1078 700" stroke-width="10"/>
      <path class="kp-spark kp-spark2" d="M1064 786 L1088 792" stroke-width="10"/>
    </g>
   </g>
  </g>
</svg>
