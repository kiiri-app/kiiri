name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build, sign and
# publish installers + the auto-update metadata (latest*.yml) to the public
# kiiri-app/kiiri-releases repo (build.publish). Signing is skipped gracefully
# when the secrets are not set yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Notarization via an App Store Connect API key (preferred over an Apple ID
      # password: no 2FA prompts). electron-builder wants the .p8 as a file path.
      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$APPLE_API_KEY_P8" ] || { echo "No API key secret; notarization falls back to APPLE_ID."; exit 0; }
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and publish
        run: npx electron-builder --publish always
        env:
          # Fine-grained PAT with Contents: read & write on kiiri-app/kiiri-releases.
          # The built-in GITHUB_TOKEN cannot write to another repository.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # macOS: Developer ID Application cert (.p12, base64)
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization: API key (APPLE_API_KEY is set by the step above) ...
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # ... or, as a fallback, Apple ID + app-specific password
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: code-signing certificate (see RELEASING.md)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
