<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Same lockdown as the other windows. Extras: file: images for community
       pets (their sheets live outside the app, e.g. ~/.codex/pets) and data:
       audio for TTS answers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob:; object-src 'none'; connect-src 'self'">
  <title>Kiri</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="drag-handle"></div>
  <div id="share-name-badge"></div>
  <div id="cat-speech-bubble"></div>
  <div id="cat-thinking-dots" aria-label="thinking"><span>.</span><span>.</span><span>.</span></div>
  <button id="reminder-clock-button" type="button" aria-label="Open reminders">
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="6" y="1" width="4" height="2" fill="currentColor"/>
      <rect x="4" y="3" width="8" height="2" fill="currentColor"/>
      <rect x="2" y="5" width="2" height="6" fill="currentColor"/>
      <rect x="12" y="5" width="2" height="6" fill="currentColor"/>
      <rect x="4" y="11" width="8" height="2" fill="currentColor"/>
      <rect x="6" y="5" width="2" height="4" fill="currentColor"/>
      <rect x="8" y="8" width="3" height="2" fill="currentColor"/>
    </svg>
  </button>
  <button id="voice-listen-button" type="button" aria-label="Voice command" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="6" y="1" width="4" height="8" rx="2" fill="currentColor"/>
      <path d="M4 7v1a4 4 0 0 0 8 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="7" y="12" width="2" height="3" fill="currentColor"/>
    </svg>
  </button>
  <section id="reminder-panel" aria-label="Reminders">
    <div class="reminder-panel-header">
      <div id="reminder-panel-title">Reminder</div>
      <div class="reminder-panel-header-actions">
        <button type="button" id="reminder-add-button">Add</button>
        <button type="button" id="reminder-panel-close">Close</button>
      </div>
    </div>
    <form id="reminder-form">
      <div class="reminder-schedule-row">
        <input id="reminder-time-input" type="time" required>
        <input id="reminder-repeat-input" type="hidden" value="none">
        <div id="reminder-repeat-buttons" class="reminder-repeat-buttons" role="group" aria-label="Repeat">
          <button type="button" data-repeat="none" class="is-selected">Once</button>
          <button type="button" data-repeat="custom">Choose days</button>
        </div>
      </div>
      <div id="reminder-day-picker" class="reminder-day-picker" aria-label="Choose days">
        <label><input type="checkbox" value="1">Mon</label>
        <label><input type="checkbox" value="2">Tue</label>
        <label><input type="checkbox" value="3">Wed</label>
        <label><input type="checkbox" value="4">Thu</label>
        <label><input type="checkbox" value="5">Fri</label>
        <label><input type="checkbox" value="6">Sat</label>
        <label><input type="checkbox" value="0">Sun</label>
      </div>
      <div class="reminder-message-row">
        <input id="reminder-message-input" type="text" maxlength="80" placeholder="What should Kiri remind you?" required autocomplete="off">
        <button type="button" id="reminder-cancel-button">Cancel</button>
        <button type="submit" id="reminder-save-button">Save</button>
      </div>
    </form>
    <div id="reminder-list"></div>
  </section>
  <form id="cat-name-editor">
    <input id="cat-name-input" type="text" maxlength="24" autocomplete="off">
    <button type="submit" aria-label="Save name">
      <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
        <rect x="2" y="6" width="2" height="2" fill="currentColor"/>
        <rect x="4" y="8" width="2" height="2" fill="currentColor"/>
        <rect x="6" y="6" width="2" height="2" fill="currentColor"/>
        <rect x="8" y="4" width="2" height="2" fill="currentColor"/>
      </svg>
    </button>
    <button type="button" id="cat-name-cancel" aria-label="Cancel name edit">
      <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
        <rect x="3" y="3" width="2" height="2" fill="currentColor"/>
        <rect x="7" y="3" width="2" height="2" fill="currentColor"/>
        <rect x="5" y="5" width="2" height="2" fill="currentColor"/>
        <rect x="3" y="7" width="2" height="2" fill="currentColor"/>
        <rect x="7" y="7" width="2" height="2" fill="currentColor"/>
      </svg>
    </button>
  </form>
  <form id="user-name-editor">
    <p id="user-name-guide">Tell Kiri your name, and Kiri will call you for reminders and other moments.</p>
    <div class="user-name-row">
      <input id="user-name-input" type="text" maxlength="24" placeholder="Enter your name" autocomplete="off">
      <button type="submit" id="user-name-save" aria-label="Save user name">
        <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
          <rect x="2" y="6" width="2" height="2" fill="currentColor"/>
          <rect x="4" y="8" width="2" height="2" fill="currentColor"/>
          <rect x="6" y="6" width="2" height="2" fill="currentColor"/>
          <rect x="8" y="4" width="2" height="2" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" id="user-name-cancel">×</button>
    </div>
  </form>
  <form id="persona-editor">
    <p id="persona-guide"></p>
    <textarea id="persona-input" maxlength="500" rows="3" autocomplete="off"></textarea>
    <div class="persona-row">
      <button type="submit" id="persona-save">OK</button>
      <button type="button" id="persona-cancel">×</button>
    </div>
  </form>
  <form id="fixed-message-editor">
    <input id="fixed-message-input" type="text" maxlength="80" autocomplete="off">
    <button type="submit" id="fixed-message-save">OK</button>
    <button type="button" id="fixed-message-cancel">×</button>
  </form>
  <form id="screen-ask-editor">
    <input id="screen-ask-input" type="text" maxlength="300" autocomplete="off">
    <button type="submit" id="screen-ask-send" aria-label="Ask">🔍</button>
    <button type="button" id="screen-ask-cancel">×</button>
  </form>
  <form id="pomodoro-focus-editor">
    <input id="pomodoro-focus-input" type="number" min="1" max="180" step="1" autocomplete="off">
    <span>MIN</span>
    <button type="submit">OK</button>
    <button type="button" id="pomodoro-focus-cancel">×</button>
  </form>
  <!-- Pose-set characters (kiri / tori): flat per-state PNG art + painted pixel overlay -->
  <div id="poseset" aria-label="character" hidden>
    <img id="pose-noeye" class="pose" alt="" draggable="false">
    <!-- The other states are sprite strips (svg/<set>_<state>.png, built by
         scripts/build-pose-sheets.py) animated via background-position. -->
    <div id="pose-move" class="pose pose-anim"></div>
    <div id="pose-listening" class="pose pose-anim"></div>
    <div id="pose-working" class="pose pose-anim"></div>
    <div id="pose-happy" class="pose pose-anim"></div>
    <canvas id="poseset-overlay" aria-hidden="true"></canvas>
    <!-- Tracking pupils overlaid on the idle art's eyes (flat PNG has none). -->
    <span id="pose-pupil-l" class="pose-pupil" aria-hidden="true"></span>
    <span id="pose-pupil-r" class="pose-pupil" aria-hidden="true"></span>
  </div>
  <!-- Community pets (petdex / agentpets sprite sheets): one canvas, JS blits
       the current frame out of the sheet. -->
  <canvas id="petdex" aria-label="character" hidden></canvas>
  <script src="pose-manifest.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
