<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <link rel="stylesheet" href="overlay.css" />
  <title>Pixel Editor</title>
</head>
<body>
  <div id="titlebar">
    <span>🎨 <span data-i18n="windowTitle">Pixel Editor</span> <small id="char-name"></small></span>
    <button id="close-btn" type="button" aria-label="Close" data-i18n-aria="close">×</button>
  </div>

  <div id="toolbar">
    <div class="tool-group" id="palette" aria-label="Color palette" data-i18n-aria="paletteAria"></div>
    <label class="custom-color">
      <input type="color" id="custom-color" value="#e0573a" />
      <span data-i18n="customColor">Custom</span>
    </label>
    <div class="tool-group" id="modes">
      <button type="button" class="tool-btn active" data-mode="paint" data-i18n="paint">✏️ Paint</button>
      <button type="button" class="tool-btn" data-mode="erase" data-i18n="erase">🩹 Erase</button>
    </div>
    <div class="tool-group" id="brushes">
      <button type="button" class="tool-btn brush active" data-brush="1">•</button>
      <button type="button" class="tool-btn brush" data-brush="2">●</button>
      <button type="button" class="tool-btn brush" data-brush="3">⬤</button>
    </div>
    <div class="tool-group" id="grids">
      <span class="tool-label" data-i18n="gridLabel">Grid</span>
      <button type="button" class="tool-btn grid" data-cols="28">S</button>
      <button type="button" class="tool-btn grid active" data-cols="40">M</button>
      <button type="button" class="tool-btn grid" data-cols="56">L</button>
    </div>
    <div class="tool-group right">
      <label class="toggle"><input type="checkbox" id="grid-toggle" checked /> <span data-i18n="gridLabel">Grid</span></label>
      <button type="button" id="clear-btn" class="tool-btn danger" data-i18n="clear">Clear</button>
    </div>
  </div>

  <main id="stage-wrap">
    <div id="stage">
      <img id="bg" alt="" draggable="false" />
      <canvas id="paint"></canvas>
    </div>
    <p id="not-poseset" data-i18n-html="notPoseset" hidden>The pixel editor is only for the Kiri / Tori characters.<br />Pick Kiri or Tori in "Character Appearance" first.</p>
  </main>

  <div id="actionbar">
    <label class="ab-field">
      <span data-i18n="designLabel">Design</span>
      <select id="variant-select" title="Saved designs" data-i18n-title="savedDesignsTitle"></select>
    </label>
    <button id="variant-delete" type="button" class="tool-btn danger" title="Delete selected design" data-i18n-title="deleteSelectedTitle">🗑</button>
    <input id="variant-name" type="text" maxlength="40" placeholder="Design name…" data-i18n-ph="designNamePlaceholder" />
    <button id="saveas-btn" type="button" class="tool-btn" data-i18n="saveAs">💾 Save as</button>
    <button id="save-btn" type="button" class="tool-btn primary" data-i18n="saveBtn">✓ Save</button>
    <span id="dirty" data-i18n="unsaved" hidden>● unsaved</span>
  </div>

  <div id="statusbar">
    <span id="hint" data-i18n="hint">Left-click to paint · drag to draw · live preview on</span>
    <span id="count"></span>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
