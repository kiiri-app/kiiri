<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 567 1150" overflow="visible">
  <!-- Tori working: the painterly notepad art rocking in a write-write-pause
       rhythm, with a cursive scribble drawing itself onto the pad (matching
       the blue ink already painted there). Prefix: tw- -->
  <style>
    #tw-body {
      transform-box: fill-box;
      transform-origin: 50% 98%;
      animation: tw-write 3.6s ease-in-out infinite;
    }
    @keyframes tw-write {                        /* same burst rhythm as kiri's quill */
      0%, 8%   { transform: rotate(0deg); }
      12%      { transform: rotate(-0.9deg); }
      18%      { transform: rotate(0.7deg); }
      24%      { transform: rotate(-0.8deg); }
      30%      { transform: rotate(0.6deg); }
      36%      { transform: rotate(-0.9deg); }
      42%      { transform: rotate(0.5deg); }
      48%      { transform: rotate(-0.6deg); }
      56%, 100%{ transform: rotate(0deg); }
    }
    #tw-scribble {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: tw-scribble 3.6s linear infinite;
    }
    @keyframes tw-scribble {
      0%, 8%    { stroke-dashoffset: 260; opacity: 1; }
      52%       { stroke-dashoffset: 0;   opacity: 1; }
      76%       { stroke-dashoffset: 0;   opacity: 1; }
      90%, 100% { stroke-dashoffset: 260; opacity: 0; }
    }
  </style>

  <g id="tw-body">
    <image href="../svg/tori_working.png" width="567" height="1150"/>
    <!-- the scribble lands on the notepad face, continuing the painted 'l' -->
    <path id="tw-scribble" d="M382 585 C396 572 404 578 400 590 C396 602 406 606 416 596 C426 586 436 590 432 602 C428 612 438 618 448 610" stroke="#3a6ea8" stroke-width="7" stroke-linecap="round" fill="none" transform="rotate(9 400 590)"/>
  </g>
</svg>
