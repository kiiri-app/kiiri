<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <link rel="stylesheet" href="ai-character.css" />
  <title>Character Appearance</title>
</head>
<body>
  <div id="titlebar">
    <span>🎨 <span data-i18n="windowTitle">Character Appearance</span> <small id="char-name"></small></span>
    <button id="close-btn" type="button" aria-label="Close" data-i18n-aria="close">×</button>
  </div>

  <main>
    <div id="preview-wrap">
      <img id="preview-pose" alt="preview" data-i18n-alt="previewAlt" />
      <p id="classic-note" data-i18n="classicNote" hidden>Classic cat — its pattern is edited in the "Pattern Editor".</p>
    </div>

    <section class="group">
      <div class="seg-label" data-i18n="characterLabel">Character</div>
      <div id="sets" class="sets"></div>
      <button id="paint-btn" type="button" class="ghost-btn full" data-i18n="editPixels">🎨 Edit pixels</button>
    </section>

    <button id="apply-btn" type="button" class="primary-btn full" data-i18n="apply">Apply</button>
  </main>
  <script src="ai-character.js"></script>
</body>
</html>
