<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 2000" overflow="visible">
  <!-- Kiri scruff-hold drag pose: hanging limp from the grab point like a kitten
       carried by the neck. Driven by the renderer via CSS vars on an ancestor:
         - -ks-sway    : rotation with unit, e.g. "4.2deg" (drag pendulum)
         - -ks-stretch : 0..1 number (drag energy -> body elongation)
       All ids/classes prefixed ks- (SVGs are inlined into the page DOM). -->
  <style>
    #ks-root {
      transform-box: fill-box;
      transform-origin: 50% 1.2%;               /* the pinched scruff fold */
      transform: rotate(var(--ks-sway, 0deg));
    }
    #ks-pend {                                   /* self sway so it never freezes */
      transform-box: fill-box;
      transform-origin: 50% 1.2%;
      animation: ks-pend 4.8s ease-in-out infinite;
    }
    @keyframes ks-pend {
      0%, 100% { transform: rotate(1.6deg); }
      50%      { transform: rotate(-1.6deg); }
    }
    #ks-stretch {                                /* body elongates under drag energy */
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transform: scale(1, calc(1 + var(--ks-stretch, 0) * 0.14));
    }
    .ks-foreleg-l, .ks-foreleg-r {               /* limp dangling front legs */
      transform-box: fill-box;
      transform-origin: 50% 4%;
      animation: ks-dangle 3.6s ease-in-out infinite;
    }
    .ks-foreleg-r { animation-delay: -1.1s; }
    @keyframes ks-dangle {
      0%, 100% { transform: rotate(2.6deg); }
      50%      { transform: rotate(-2.6deg); }
    }
    #ks-hind {                                   /* hind legs curl up slightly */
      transform-box: fill-box;
      transform-origin: 50% 10%;
      animation: ks-hind 5.4s ease-in-out infinite;
    }
    @keyframes ks-hind {
      0%, 100% { transform: rotate(-1.4deg); }
      50%      { transform: rotate(1.8deg); }
    }
    #ks-tail {
      transform-box: fill-box;
      transform-origin: 70% 4%;                  /* tail root at the rump */
      animation: ks-tail 3.4s ease-in-out infinite;
    }
    @keyframes ks-tail {
      0%, 100% { transform: rotate(6deg); }
      50%      { transform: rotate(-7deg); }
    }
    .ks-ear-l, .ks-ear-r {                       /* ears pinned back, tiny twitch */
      transform-box: fill-box;
      transform-origin: 50% 96%;
    }
    .ks-ear-l { animation: ks-twitch-l 6.5s linear infinite; }
    .ks-ear-r { animation: ks-twitch-r 7.3s linear infinite; }
    @keyframes ks-twitch-l {
      0%, 91%, 100% { transform: rotate(0deg); }
      93%           { transform: rotate(-7deg); }
      95%           { transform: rotate(2deg); }
    }
    @keyframes ks-twitch-r {
      0%, 55%, 64%, 100% { transform: rotate(0deg); }
      57%                { transform: rotate(7deg); }
      60%                { transform: rotate(-2deg); }
    }
    .ks-lid {                                    /* slow resigned blink */
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transform: scaleY(0);
      animation: ks-blink 4.2s linear infinite;
    }
    @keyframes ks-blink {
      0%, 90.5%, 97%, 100% { transform: scaleY(0); }
      92.5%, 95%           { transform: scaleY(1); }
    }
    #ks-pupils { animation: ks-look 9s ease-in-out infinite; }
    @keyframes ks-look {
      0%, 34%, 100% { transform: translate(0px, -6px); }
      42%, 60%      { transform: translate(16px, -12px); }
      70%, 88%      { transform: translate(-10px, -4px); }
    }
  </style>

  <g id="ks-root">
    <g id="ks-pend">
      <!-- pinched scruff fold (grab point) -->
      <path d="M533 24 C503 62 472 100 462 138 C508 122 558 122 604 138 C594 98 563 60 533 24 Z" fill="#101216"/>

      <!-- ============ HEAD (big, hangs below the pinch, tilted) ============ -->
      <g id="ks-head" transform="rotate(-4 533 420)">
        <!-- ears folded back/outward; inner whites sit fully inside the black -->
        <g class="ks-ear-l">
          <path d="M340 190 C276 92 216 34 172 30 C158 96 180 204 240 320 C276 270 312 224 340 190 Z" fill="#101216"/>
          <path d="M310 208 C270 148 234 108 210 96 C206 140 224 204 258 268 C278 244 296 224 310 208 Z" fill="#fdfdfd"/>
        </g>
        <g class="ks-ear-r">
          <path d="M726 190 C790 92 850 34 894 30 C908 96 886 204 826 320 C790 270 754 224 726 190 Z" fill="#101216"/>
          <path d="M756 208 C796 148 832 108 856 96 C860 140 842 204 808 268 C788 244 770 224 756 208 Z" fill="#fdfdfd"/>
        </g>
        <!-- head blob (bigger, Jiji-round) -->
        <path d="M533 130 C348 130 208 246 208 424 C208 590 350 692 533 692 C716 692 858 590 858 424 C858 246 718 130 533 130 Z" fill="#101216"/>
        <!-- whiskers, drooping -->
        <g stroke="#101216" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M214 448 C136 468 74 490 24 518"/>
          <path d="M220 492 C148 518 92 546 50 578"/>
          <path d="M852 448 C930 468 992 490 1042 518"/>
          <path d="M846 492 C918 518 974 546 1016 578"/>
        </g>
        <!-- eyes: wide, resigned -->
        <g>
          <ellipse cx="430" cy="428" rx="94" ry="102" fill="#ffffff"/>
          <ellipse cx="636" cy="428" rx="94" ry="102" fill="#ffffff"/>
          <g id="ks-pupils" fill="#101216">
            <circle cx="430" cy="434" r="29"/>
            <circle cx="636" cy="434" r="29"/>
          </g>
          <rect class="ks-lid" x="334" y="324" width="192" height="208" rx="94" fill="#101216"/>
          <rect class="ks-lid" x="540" y="324" width="192" height="208" rx="94" fill="#101216"/>
        </g>
        <!-- nose + small flat mouth -->
        <path d="M515 502 C521 494 545 494 551 502 C547 514 537 522 533 522 C529 522 519 514 515 502 Z" fill="#e59aa6"/>
        <path d="M506 556 C524 564 542 564 560 556" stroke="#2a2d36" stroke-width="8" stroke-linecap="round" fill="none"/>
      </g>

      <!-- ============ BODY (stretch group hangs from the neck) ============ -->
      <g id="ks-stretch">
        <!-- tail behind the body -->
        <path id="ks-tail" d="M600 1258 C650 1320 686 1392 680 1470 C674 1538 636 1592 584 1610 C560 1618 540 1604 546 1582 C550 1566 574 1560 596 1538 C630 1504 638 1452 620 1398 C606 1352 580 1310 562 1282 Z" fill="#101216" stroke="#3a3f4c" stroke-width="7" stroke-linejoin="round"/>
        <!-- hind legs, tucked up -->
        <g id="ks-hind">
          <path d="M462 1204 C448 1282 452 1348 472 1386 C490 1420 522 1430 546 1414 C562 1402 560 1378 546 1368 C528 1356 516 1340 510 1306 C504 1272 504 1234 506 1204 Z" fill="#101216" stroke="#3a3f4c" stroke-width="7" stroke-linejoin="round"/>
          <path d="M604 1204 C618 1282 614 1348 594 1386 C576 1420 544 1430 520 1414 C504 1402 506 1378 520 1368 C538 1356 550 1340 556 1306 C562 1272 562 1234 560 1204 Z" fill="#101216" stroke="#3a3f4c" stroke-width="7" stroke-linejoin="round"/>
        </g>
        <!-- torso: slim, hanging (shorter than the head is tall — kitten carry) -->
        <path d="M533 640 C446 640 390 706 386 812 C382 940 406 1116 440 1222 C466 1298 502 1330 533 1330 C564 1330 600 1298 626 1222 C660 1116 684 940 680 812 C676 706 620 640 533 640 Z" fill="#101216"/>
        <!-- front legs dangle in front of the torso (edged so they read on black) -->
        <g class="ks-foreleg-l">
          <path d="M452 724 C428 724 412 746 412 784 L412 1044 C412 1092 430 1120 456 1120 C482 1120 498 1092 498 1044 L494 784 C494 746 476 724 452 724 Z" fill="#101216" stroke="#3a3f4c" stroke-width="7"/>
          <path d="M456 1048 C430 1048 414 1070 416 1096 C418 1120 434 1134 456 1134 C478 1134 494 1120 496 1096 C498 1070 482 1048 456 1048 Z" fill="#181b22" stroke="#3a3f4c" stroke-width="6"/>
          <g stroke="#3a3f4c" stroke-width="6" stroke-linecap="round">
            <path d="M442 1128 L442 1104"/>
            <path d="M468 1128 L468 1104"/>
          </g>
        </g>
        <g class="ks-foreleg-r">
          <path d="M614 724 C590 724 574 746 572 784 L568 1044 C568 1092 584 1120 610 1120 C636 1120 654 1092 654 1044 L654 784 C654 746 638 724 614 724 Z" fill="#101216" stroke="#3a3f4c" stroke-width="7"/>
          <path d="M610 1048 C584 1048 568 1070 570 1096 C572 1120 588 1134 610 1134 C632 1134 648 1120 650 1096 C652 1070 636 1048 610 1048 Z" fill="#181b22" stroke="#3a3f4c" stroke-width="6"/>
          <g stroke="#3a3f4c" stroke-width="6" stroke-linecap="round">
            <path d="M596 1128 L596 1104"/>
            <path d="M622 1128 L622 1104"/>
          </g>
        </g>
        <!-- blue bow at the neck (over the torso top) -->
        <g id="ks-bow">
          <path d="M506 664 C446 628 378 608 328 612 C308 658 308 710 328 756 C380 758 448 736 506 698 Z" fill="#274794" stroke="#16204a" stroke-width="10" stroke-linejoin="round"/>
          <path d="M560 664 C620 628 688 608 738 612 C758 658 758 710 738 756 C686 758 618 736 560 698 Z" fill="#274794" stroke="#16204a" stroke-width="10" stroke-linejoin="round"/>
          <rect x="494" y="642" width="78" height="80" rx="20" fill="#274794" stroke="#16204a" stroke-width="10"/>
        </g>
      </g>
    </g>
  </g>
</svg>
