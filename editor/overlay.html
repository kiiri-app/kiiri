<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <link rel="stylesheet" href="overlay.css" />
  <title>Piksel Editörü</title>
</head>
<body>
  <div id="titlebar">
    <span>🎨 Piksel Editörü <small id="char-name"></small></span>
    <button id="close-btn" type="button" aria-label="Kapat">×</button>
  </div>

  <div id="toolbar">
    <div class="tool-group" id="palette" aria-label="Renk paleti"></div>
    <label class="custom-color">
      <input type="color" id="custom-color" value="#e0573a" />
      <span>Özel</span>
    </label>
    <div class="tool-group" id="modes">
      <button type="button" class="tool-btn active" data-mode="paint">✏️ Boya</button>
      <button type="button" class="tool-btn" data-mode="erase">🩹 Sil</button>
    </div>
    <div class="tool-group" id="brushes">
      <button type="button" class="tool-btn brush active" data-brush="1">•</button>
      <button type="button" class="tool-btn brush" data-brush="2">●</button>
      <button type="button" class="tool-btn brush" data-brush="3">⬤</button>
    </div>
    <div class="tool-group" id="grids">
      <span class="tool-label">Izgara</span>
      <button type="button" class="tool-btn grid" data-cols="28">S</button>
      <button type="button" class="tool-btn grid active" data-cols="40">M</button>
      <button type="button" class="tool-btn grid" data-cols="56">L</button>
    </div>
    <div class="tool-group right">
      <label class="toggle"><input type="checkbox" id="grid-toggle" checked /> Izgara</label>
      <button type="button" id="clear-btn" class="tool-btn danger">Temizle</button>
    </div>
  </div>

  <main id="stage-wrap">
    <div id="stage">
      <img id="bg" alt="" draggable="false" />
      <canvas id="paint"></canvas>
    </div>
    <p id="not-poseset" hidden>Piksel editörü yalnızca Kiri / Tori karakterleri için.<br />Önce "Karakter Görünümü"nden Kiri ya da Tori seç.</p>
  </main>

  <div id="actionbar">
    <label class="ab-field">
      <span>Tasarım</span>
      <select id="variant-select" title="Kayıtlı tasarımlar"></select>
    </label>
    <button id="variant-delete" type="button" class="tool-btn danger" title="Seçili tasarımı sil">🗑</button>
    <input id="variant-name" type="text" maxlength="40" placeholder="Tasarım adı…" />
    <button id="saveas-btn" type="button" class="tool-btn">💾 Farklı kaydet</button>
    <button id="save-btn" type="button" class="tool-btn primary">✓ Kaydet</button>
    <span id="dirty" hidden>● kaydedilmedi</span>
  </div>

  <div id="statusbar">
    <span id="hint">Sol tık ile boya · sürükleyerek çiz · canlı önizleme açık</span>
    <span id="count"></span>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
