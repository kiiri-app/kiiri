<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="500" height="540" aria-label="character">
  <defs>
    <style>
      svg {
        --body: #8aa0b8;       /* gövde rengi */
        --belly: #efe6d2;      /* karın rengi */
        --eyebg: #ffffff;      /* göz aklığı */
        --eye: #1e1e1e;        /* göz bebeği */
        --accent: #d94a3a;     /* papyon / yaprak / şevron / detay */
        --mouth: #6b3b2a;      /* ağız */
      }

      /* ---- özellik kapıları (varsayılan gizli, sınıfla göster) ---- */
      #ears-cat, #ears-round, #ears-totoro,
      #acc-bow, #acc-leaf,
      #mouth-grin, #mouth-calm,
      #belly-marks, #whiskers,
      #prop-think, #prop-note, #prop-happy { display: none; }

      svg.ears-cat   #ears-cat   { display: inline; }
      svg.ears-round #ears-round { display: inline; }
      svg.ears-totoro #ears-totoro { display: inline; }
      svg.acc-bow  #acc-bow  { display: inline; }
      svg.acc-leaf #acc-leaf { display: inline; }
      svg.face-grin #mouth-grin { display: inline; }
      svg.face-calm #mouth-calm { display: inline; }
      svg.marks-on #belly-marks { display: inline; }
      svg.whiskers-on #whiskers { display: inline; }

      /* ---- idle: nazik nefes + sallanma ---- */
      #bob { transform-origin: 60px 80px; animation: bob 3.6s ease-in-out infinite; }
      @keyframes bob {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        50%      { transform: translateY(-2px) scale(1.01, 0.99); }
      }
      /* göz kırpma */
      #eye-whites { transform-origin: 60px 58px; animation: blink 5.4s infinite; }
      @keyframes blink {
        0%, 94%, 100% { transform: scaleY(1); }
        97%           { transform: scaleY(0.1); }
      }

      /* ---- DÜŞÜNME ---- */
      svg.state-thinking #bob { animation: think-tilt 4s ease-in-out infinite; transform-origin: 60px 92px; }
      @keyframes think-tilt {
        0%, 100% { transform: rotate(-3deg); }
        50%      { transform: rotate(3deg); }
      }
      svg.state-thinking #prop-think { display: inline; animation: pop 0.3s ease-out; }
      svg.state-thinking #think-q { animation: q-pulse 1.6s ease-in-out infinite; transform-origin: 99px 24px; }
      @keyframes q-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      svg.state-thinking #think-d1 { animation: q-pulse 1.6s ease-in-out 0.2s infinite; }
      svg.state-thinking #think-d2 { animation: q-pulse 1.6s ease-in-out 0.4s infinite; }

      /* ---- NOT ALMA ---- */
      svg.state-note #bob { animation: note-lean 0.9s ease-in-out infinite; transform-origin: 60px 92px; }
      @keyframes note-lean {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50%      { transform: translateY(2px) rotate(2deg); }
      }
      svg.state-note #prop-note { display: inline; animation: pop 0.3s ease-out; }
      svg.state-note #pencil { animation: scribble 0.32s steps(2) infinite; transform-origin: 96px 104px; }
      @keyframes scribble {
        0% { transform: translate(0,0) rotate(0deg); }
        50% { transform: translate(-2px,1px) rotate(-8deg); }
        100% { transform: translate(0,0) rotate(0deg); }
      }

      /* ---- MUTLU ---- */
      svg.state-happy #bob { animation: happy-bounce 0.5s ease-in-out infinite; transform-origin: 60px 105px; }
      @keyframes happy-bounce {
        0%, 100% { transform: translateY(0) scale(1,1); }
        40%      { transform: translateY(-7px) scale(0.98,1.04); }
        70%      { transform: translateY(0) scale(1.03,0.97); }
      }
      svg.state-happy #prop-happy { display: inline; animation: pop 0.4s ease-out; }
      #spark-a { animation: spark 0.9s ease-in-out infinite; transform-origin: 24px 30px; }
      #spark-b { animation: spark 0.9s ease-in-out 0.3s infinite; transform-origin: 96px 34px; }
      @keyframes spark { 0%,100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.1); } }

      /* ---- BASMA (squash) ---- */
      svg.state-press #bob { animation: none; transform-origin: 60px 110px; transform: translateY(3px) scale(1.05, 0.92); }

      @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1); } }
    </style>
  </defs>

  <!-- lean: cursor'a göre gövde eğimi (renderer transform verir) -->
  <g id="lean">
    <g id="bob">

      <!-- KULAKLAR -->
      <g id="ears-totoro">
        <path d="M30 44 Q24 8 44 30 Z" fill="var(--body)"/>
        <path d="M90 44 Q96 8 76 30 Z" fill="var(--body)"/>
      </g>
      <g id="ears-cat">
        <path d="M34 40 L26 14 L52 32 Z" fill="var(--body)"/>
        <path d="M86 40 L94 14 L68 32 Z" fill="var(--body)"/>
        <path d="M35 36 L31 22 L46 33 Z" fill="var(--accent)" opacity="0.55"/>
        <path d="M85 36 L89 22 L74 33 Z" fill="var(--accent)" opacity="0.55"/>
      </g>
      <g id="ears-round">
        <circle cx="38" cy="34" r="12" fill="var(--body)"/>
        <circle cx="82" cy="34" r="12" fill="var(--body)"/>
      </g>

      <!-- GÖVDE -->
      <ellipse id="body" cx="60" cy="72" rx="40" ry="44" fill="var(--body)"/>
      <!-- karın -->
      <ellipse id="belly" cx="60" cy="84" rx="26" ry="28" fill="var(--belly)"/>
      <!-- karın şevronları (totoro) -->
      <g id="belly-marks" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round">
        <path d="M50 80 L60 86 L70 80"/>
        <path d="M50 90 L60 96 L70 90"/>
      </g>

      <!-- BIYIKLAR -->
      <g id="whiskers" stroke="var(--mouth)" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
        <line x1="30" y1="64" x2="8"  y2="60"/>
        <line x1="30" y1="68" x2="7"  y2="69"/>
        <line x1="90" y1="64" x2="112" y2="60"/>
        <line x1="90" y1="68" x2="113" y2="69"/>
      </g>

      <!-- YÜZ -->
      <g id="eye-whites">
        <ellipse cx="47" cy="60" rx="9" ry="11" fill="var(--eyebg)"/>
        <ellipse cx="73" cy="60" rx="9" ry="11" fill="var(--eyebg)"/>
      </g>
      <!-- göz bebekleri: renderer cursor'a göre kaydırır -->
      <g id="eyes-track">
        <circle cx="47" cy="61" r="4.6" fill="var(--eye)"/>
        <circle cx="73" cy="61" r="4.6" fill="var(--eye)"/>
        <circle cx="48.6" cy="59" r="1.5" fill="#ffffff"/>
        <circle cx="74.6" cy="59" r="1.5" fill="#ffffff"/>
      </g>
      <!-- burun -->
      <path d="M57 70 L63 70 L60 74 Z" fill="var(--mouth)"/>
      <!-- ağızlar -->
      <path id="mouth-grin" d="M40 78 Q60 98 80 78 Q60 88 40 78 Z" fill="var(--mouth)"/>
      <path id="mouth-calm" d="M54 76 Q60 82 66 76" fill="none" stroke="var(--mouth)" stroke-width="2" stroke-linecap="round"/>

      <!-- AKSESUAR: papyon -->
      <g id="acc-bow" transform="translate(60 104)">
        <path d="M0 0 L-14 -7 L-14 7 Z" fill="var(--accent)"/>
        <path d="M0 0 L14 -7 L14 7 Z" fill="var(--accent)"/>
        <circle cx="0" cy="0" r="4" fill="var(--accent)" stroke="#00000022" stroke-width="0.5"/>
      </g>
      <!-- AKSESUAR: yaprak (kafanın tepesinden filizlenir) -->
      <g id="acc-leaf" transform="translate(58 34) rotate(-12)">
        <path d="M0 0 Q9 -11 0 -22 Q-9 -11 0 0 Z" fill="#6fae54"/>
        <line x1="0" y1="0" x2="0" y2="-18" stroke="#4d8038" stroke-width="1.3"/>
      </g>

    </g>
  </g>

  <!-- DURUM PROP'LARI (lean dışında, köşelerde sabit) -->
  <g id="prop-think">
    <circle cx="99" cy="24" r="13" fill="#ffffff" stroke="#00000018" stroke-width="1"/>
    <circle id="think-d1" cx="84" cy="40" r="3.5" fill="#ffffff"/>
    <circle id="think-d2" cx="90" cy="33" r="2.3" fill="#ffffff"/>
    <text id="think-q" x="99" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#555">?</text>
  </g>
  <g id="prop-note">
    <rect x="84" y="92" width="26" height="22" rx="2.5" fill="#fffdf5" stroke="#00000022" stroke-width="1"/>
    <line x1="88" y1="98" x2="106" y2="98" stroke="#c9c2ad" stroke-width="1.4"/>
    <line x1="88" y1="103" x2="106" y2="103" stroke="#c9c2ad" stroke-width="1.4"/>
    <line x1="88" y1="108" x2="100" y2="108" stroke="#c9c2ad" stroke-width="1.4"/>
    <g id="pencil">
      <rect x="93" y="86" width="4" height="20" rx="1.5" fill="var(--accent)" transform="rotate(28 95 96)"/>
      <path d="M99 104 l3 5 l-5 -1 Z" fill="#3a2a1a"/>
    </g>
  </g>
  <g id="prop-happy" fill="var(--accent)">
    <path id="spark-a" d="M24 24 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z"/>
    <path id="spark-b" d="M96 28 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 Z"/>
  </g>
</svg>
