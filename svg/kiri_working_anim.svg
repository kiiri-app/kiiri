<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 468" overflow="visible">
  <!-- Kiri working: the painterly "writing" art from kiri_working.png
       (2 cells of ~396x468) alternated as a 2-frame writing loop, with the
       whole body rocking in a write-write-pause rhythm. Prefix: kw-
       PNG-wrap: we swap/rock the ORIGINAL frames, never redraw the cat. -->
  <style>
    #kw-body {
      transform-box: fill-box;
      transform-origin: 50% 98%;
      animation: kw-write 3.6s ease-in-out infinite;
    }
    @keyframes kw-write {                        /* gentle write-burst body rock */
      0%, 8%   { transform: rotate(0deg); }
      12%      { transform: rotate(-0.9deg); }
      18%      { transform: rotate(0.7deg); }
      24%      { transform: rotate(-0.8deg); }
      30%      { transform: rotate(0.6deg); }
      36%      { transform: rotate(-0.9deg); }
      42%      { transform: rotate(0.5deg); }
      48%      { transform: rotate(-0.6deg); }
      56%, 100%{ transform: rotate(0deg); }
    }
    /* 2-frame writing loop: the drawn frames alternate ~2.7x/s (matches the
       legacy sheet's 3.6fps loop over 2 frames). */
    .kw-f0 { animation: kw-flip 0.56s steps(1, end) infinite; }
    .kw-f1 { animation: kw-flip 0.56s steps(1, end) infinite; animation-delay: -0.28s; }
    @keyframes kw-flip {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- The two writing cells are the same cat with the quill/hand in a different
       spot, but cell 1's content sits +77px right of cell 0's. We re-align them
       (f0 shifted +38 to centre, f1 shifted -39) so BOTH heads/bodies land at the
       same place — alternating them then reads as writing, not a jumping cat. -->
  <g id="kw-body">
    <svg class="kw-f0" x="38" y="0" width="396" height="468" viewBox="0 0 396 468">
      <image href="../svg/kiri_working.png" width="793" height="468"/>
    </svg>
    <svg class="kw-f1" x="-39" y="0" width="397" height="468" viewBox="396 0 397 468">
      <image href="../svg/kiri_working.png" width="793" height="468"/>
    </svg>
  </g>
</svg>
