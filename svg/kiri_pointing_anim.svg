<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1439" overflow="visible">
  <!-- Kiri pointing: the original idle art (kiri_noeye.png) leans toward the
       target (RIGHT by default; the renderer mirrors via scaleX(-1) when the
       target is left), with emphasis flicks toward the pointed spot. The actual
       "there!" indicator is the 🐾 paw overlay drawn by the renderer, so we keep
       the cat itself clean (no redrawn limb on the flat black silhouette).
       Prefix: kp- -->
  <style>
    #kp-body {
      transform-box: fill-box;
      transform-origin: 50% 97%;
      animation: kp-lean 4.8s ease-in-out infinite;
    }
    @keyframes kp-lean {                         /* leans at the target, bounces, glances back */
      0%, 55%   { transform: rotate(5deg) translateY(0px); }
      12%       { transform: rotate(6deg) translateY(-10px); }
      24%       { transform: rotate(5deg) translateY(0px); }
      36%       { transform: rotate(6deg) translateY(-10px); }
      48%       { transform: rotate(5deg) translateY(0px); }
      70%, 82%  { transform: rotate(1deg) translateY(0px); }
      94%, 100% { transform: rotate(5deg) translateY(0px); }
    }
    .kp-spark {
      opacity: 0;
      animation: kp-spark 2.4s ease-out infinite;
      fill: none;
      stroke: #c96f4a;
      stroke-linecap: round;
    }
    .kp-spark2 { animation-delay: -0.5s; }
    .kp-spark3 { animation-delay: -1.1s; }
    @keyframes kp-spark {
      0%, 14%  { opacity: 0; transform: scale(0.8); }
      24%      { opacity: 0.9; }
      50%, 100%{ opacity: 0; transform: scale(1.14); }
    }
    #kp-sparks { transform-box: fill-box; transform-origin: 100% 50%; }
  </style>

  <g id="kp-body">
    <image href="../svg/kiri_noeye.png" width="1065" height="1439"/>
  </g>
  <!-- emphasis flicks off to the right, toward the pointed spot -->
  <g id="kp-sparks">
    <path class="kp-spark"          d="M980 560 L1040 536" stroke-width="14"/>
    <path class="kp-spark kp-spark2" d="M998 630 L1060 632" stroke-width="14"/>
    <path class="kp-spark kp-spark3" d="M980 700 L1038 724" stroke-width="14"/>
  </g>
</svg>
