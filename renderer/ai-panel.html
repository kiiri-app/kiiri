<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <link rel="stylesheet" href="ai-panel.css" />
  <title>Kiiri AI</title>
</head>
<body>
  <div id="card">
    <div id="header">
      <span id="title">🐾 <span id="title-text">Kiri</span></span>
      <button id="close-btn" type="button" aria-label="Close" data-i18n-aria="close">×</button>
    </div>

    <!-- Menu view -->
    <section id="menu-view">
      <div id="brief" class="brief"></div>
      <div id="task-list" class="task-list"></div>
    </section>

    <!-- Busy view -->
    <section id="busy-view" hidden>
      <div class="spinner" aria-hidden="true"><span></span><span></span><span></span></div>
      <div id="busy-label" class="busy-label" data-i18n="busyLooking">Taking a look…</div>
      <button id="cancel-btn" type="button" class="ghost-btn" data-i18n="cancel">Cancel</button>
    </section>

    <!-- Result view -->
    <section id="result-view" hidden>
      <div id="result-task" class="result-task"></div>
      <div id="result-text" class="result-text"></div>
      <div id="result-actions">
        <button id="back-btn" type="button" class="ghost-btn" data-i18n="backToTasks">← Tasks</button>
        <button id="copy-btn" type="button" class="primary-btn" data-i18n="copy">Copy</button>
      </div>
      <button id="journal-btn" type="button" class="ghost-btn" data-i18n="addToJournal">📚 Add to journal</button>
    </section>
  </div>
  <script src="ai-panel.js"></script>
</body>
</html>
