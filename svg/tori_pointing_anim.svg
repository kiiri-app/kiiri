<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 932" overflow="visible">
  <!-- Tori pointing: leans toward the target (RIGHT by default; renderer
       mirrors when the target is left) with a painterly-styled arm reaching
       out. Edges are roughened with a turbulence filter so the drawn arm
       blends with the watercolor art. Prefix: tp- -->
  <defs>
    <filter id="tp-rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <style>
    #tp-body {
      transform-box: fill-box;
      transform-origin: 50% 97%;
      animation: tp-lean 4.8s ease-in-out infinite;
    }
    @keyframes tp-lean {                         /* leans at the target, bounces lightly */
      0%, 55%   { transform: rotate(5deg) translateY(0px); }
      12%       { transform: rotate(5.8deg) translateY(-8px); }
      24%       { transform: rotate(5deg) translateY(0px); }
      36%       { transform: rotate(5.8deg) translateY(-8px); }
      48%       { transform: rotate(5deg) translateY(0px); }
      70%, 82%  { transform: rotate(1deg) translateY(0px); }   /* glance back at you */
      94%, 100% { transform: rotate(5deg) translateY(0px); }
    }
    #tp-arm {
      transform-box: fill-box;
      transform-origin: 6% 60%;                  /* shoulder */
      animation: tp-bob 2.4s ease-in-out infinite;
    }
    @keyframes tp-bob {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(-4deg); }
      36%      { transform: rotate(1deg); }
      52%      { transform: rotate(-2deg); }
      68%      { transform: rotate(0deg); }
    }
    .tp-spark {
      opacity: 0;
      animation: tp-spark 2.4s ease-out infinite;
      fill: none;
      stroke: #c96f4a;
      stroke-linecap: round;
    }
    .tp-spark2 { animation-delay: -0.5s; }
    @keyframes tp-spark {
      0%, 14%  { opacity: 0; transform: scale(0.8); }
      24%      { opacity: 0.85; }
      50%, 100%{ opacity: 0; transform: scale(1.12); }
    }
    #tp-sparks { transform-box: fill-box; transform-origin: 0% 50%; }
  </style>

  <g id="tp-body">
    <image href="../svg/tori_noeye.png" width="594" height="932"/>
    <!-- pointing arm: watercolor-ish blue with cream paw, roughened edges -->
    <g transform="translate(-8 34)">
    <g id="tp-arm" filter="url(#tp-rough)">
      <path d="M468 470 C520 442 576 418 628 404 C654 398 672 408 672 426 C672 442 656 452 632 458 C584 470 534 490 492 512 C468 524 450 514 450 494 C450 482 456 476 468 470 Z"
            fill="#6d97b9" stroke="#33566f" stroke-width="7" stroke-linejoin="round"/>
      <path d="M642 396 C668 386 694 392 700 410 C706 428 692 444 668 448 C646 452 628 442 624 424 C620 408 628 400 642 396 Z"
            fill="#f2ead2" stroke="#8a7f68" stroke-width="6"/>
      <path d="M694 400 C712 394 728 398 732 410 C736 422 726 432 710 434 C696 436 684 430 682 418 C680 408 684 402 694 400 Z"
            fill="#f2ead2" stroke="#8a7f68" stroke-width="5"/>
    </g>
    </g>
    <!-- emphasis flicks at the paw tip -->
    <g id="tp-sparks">
      <path class="tp-spark"          d="M744 380 L762 366" stroke-width="8"/>
      <path class="tp-spark tp-spark2" d="M750 428 L772 434" stroke-width="8"/>
    </g>
  </g>
</svg>
