<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <link rel="stylesheet" href="ai-journal.css" />
  <title>Bilgi Defteri</title>
</head>
<body>
  <div id="titlebar">
    <span>📚 Bilgi Defteri <small id="stats"></small></span>
    <button id="close-btn" type="button" aria-label="Kapat">×</button>
  </div>

  <div id="tabs">
    <button id="tab-review" type="button" class="tab active">Tekrar</button>
    <button id="tab-cards" type="button" class="tab">Kartlar</button>
    <button id="tab-add" type="button" class="tab">Ekle</button>
  </div>

  <!-- REVIEW -->
  <main id="review-tab">
    <div id="review-empty" class="empty" hidden>Bugün tekrar edilecek kart yok 🎉</div>
    <div id="review-card" hidden>
      <div class="card-q" id="card-question"></div>
      <button id="reveal-btn" type="button" class="primary-btn full">Cevabı göster</button>
      <div class="card-a" id="card-answer" hidden></div>
      <div id="rate-row" class="rate-row" hidden>
        <button class="rate-btn again" data-q="2" type="button">Tekrar</button>
        <button class="rate-btn hard" data-q="3" type="button">Zor</button>
        <button class="rate-btn good" data-q="4" type="button">İyi</button>
        <button class="rate-btn easy" data-q="5" type="button">Kolay</button>
      </div>
    </div>
  </main>

  <!-- CARDS -->
  <main id="cards-tab" hidden>
    <div id="cards-list" class="cards-list"></div>
  </main>

  <!-- ADD -->
  <main id="add-tab" hidden>
    <form id="add-form">
      <label class="field"><span>Soru</span>
        <textarea id="add-q" rows="2" placeholder="Kartın ön yüzü (soru)"></textarea>
      </label>
      <label class="field"><span>Cevap</span>
        <textarea id="add-a" rows="3" placeholder="Kartın arka yüzü (cevap)"></textarea>
      </label>
      <button type="submit" class="primary-btn full">Kart ekle</button>
    </form>
  </main>

  <script src="ai-journal.js"></script>
</body>
</html>
