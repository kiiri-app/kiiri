name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast: syntax + unit tests. No Electron download or native build needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  # Boots the real Electron main process once and quits (--kiri-smoke-test).
  smoke:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run smoke
