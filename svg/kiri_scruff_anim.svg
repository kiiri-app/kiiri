<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 710" overflow="visible">
  <!-- Kiri scruff-hold drag: the 3 stretch frames from kiri_move.png
       (3 centred cells of ~312x710) cross-faded by drag energy, hung from the
       grab point with a pendulum sway. Driver vars (fed by poseAnimTick):
         --ks-sway (deg string), --ks-stretch (0..1 number). Prefix: ks-
       kiri_move cells are centred (offset 0) so no per-frame x shift needed.
       PNG-wrap pattern (like tori): we animate the ORIGINAL art, never redraw it. -->
  <style>
    #ks-root {
      transform-box: fill-box;
      transform-origin: 50% 2%;                  /* grab point above the nape */
      transform: rotate(var(--ks-sway, 0deg));
    }
    #ks-pend {
      transform-box: fill-box;
      transform-origin: 50% 2%;
      animation: ks-pend 5s ease-in-out infinite;
    }
    @keyframes ks-pend {
      0%, 100% { transform: rotate(1.4deg); }
      50%      { transform: rotate(-1.4deg); }
    }
    #ks-stretch {                                /* small extra elongation on top of frame swaps */
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transform: scale(1, calc(1 + var(--ks-stretch, 0) * 0.05));
    }
    /* Painterly frame cross-fade driven by the stretch amount: f0->f1->f2. */
    .ks-f0 { opacity: calc(1 - clamp(0, var(--ks-stretch, 0) * 3 - 0.45, 1)); }
    .ks-f1 { opacity: calc(clamp(0, var(--ks-stretch, 0) * 3 - 0.45, 1) - clamp(0, var(--ks-stretch, 0) * 3 - 1.55, 1)); }
    .ks-f2 { opacity: clamp(0, calc(var(--ks-stretch, 0) * 3 - 1.55), 1); }
  </style>

  <g id="ks-root">
    <g id="ks-pend">
      <g id="ks-stretch">
        <svg class="ks-f0" x="0" y="0" width="312" height="710" viewBox="0 0 312 710">
          <image href="../svg/kiri_move.png" width="937" height="710"/>
        </svg>
        <svg class="ks-f1" x="0" y="0" width="312" height="710" viewBox="312 0 312 710">
          <image href="../svg/kiri_move.png" width="937" height="710"/>
        </svg>
        <svg class="ks-f2" x="0" y="0" width="313" height="710" viewBox="624 0 313 710">
          <image href="../svg/kiri_move.png" width="937" height="710"/>
        </svg>
      </g>
      <!-- pinched black scruff tuft at the nape -->
      <path d="M156 4 C146 20 137 37 133 53 C147 45 165 45 179 53 C175 37 166 20 156 4 Z"
            fill="#101216" stroke="#3a3f47" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
